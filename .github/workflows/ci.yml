name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret committed and then deleted is still
          # in the repo for anyone who clones it.
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --exit-code 1

  ios:
    name: iOS (client current, kit tests, app builds)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - uses: arduino/setup-task@v3
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The UI test needs a running server and a token, so it is local only
      # (task ios:uitest); here it would skip.
      - name: task ios:check
        run: task ios:check

  # The web checks, one job each so they run next to `task check` instead of
  # inside it. Locally `task check` still runs all of them (task web:check).
  web-lint:
    name: web lint (oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint

  web-typecheck:
    name: web typecheck (tsgo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck

  web-test:
    name: web test (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test

  check:
    # Production runs Postgres 18 (platform/infra apps/postitheka/data/postgres.yaml). The pg19 leg is an early
    # warning for the planned 18 -> 19 upgrade and is allowed to fail; the
    # pg18 leg keeps the original job name.
    name: task check:server${{ matrix.pg != '18' && format(' (pg{0}, allowed to fail)', matrix.pg) || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "18"
            experimental: false
          - pg: "19"
            experimental: true

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postitheka
          POSTGRES_PASSWORD: postitheka
          POSTGRES_DB: postitheka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postitheka -d postitheka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # testdb fails rather than skips when CI is set and no database is
    # configured, so these tests cannot quietly stop running here.
    env:
      DATABASE_URL: postgres://postitheka:postitheka@localhost:5432/postitheka?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: arduino/setup-task@v3
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # check:server regenerates the TypeScript types and builds the web app, so
      # the web dependencies have to be installed first.
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit

      # `task check` without web:check, which the web-* jobs above run.
      - name: task check:server
        run: task check:server

      # The image is what deploys; a Dockerfile that no longer builds should
      # fail the pull request, not the merge.
      - name: Build the image
        run: docker build -t postitheka:ci .
