# Builds the image on every push to main, pushes it to GHCR tagged with the
# commit SHA, and opens a promote PR against LuminaVault/LuminaVaultInfra.
# Production runs the SHA pinned there, so merging that PR is the deploy:
# ArgoCD syncs postitheka-production in the horus namespace. Nothing in this
# repository can put a new image in front of users on its own.
#
# Required repo secret: INFRA_TOKEN, with contents:write and pull-requests:write
# on LuminaVault/LuminaVaultInfra. Without it the image is still pushed and the
# promote job FAILS (it does not skip green): a built-but-undeployed image that
# reports success looks exactly like a deploy.
name: Image

on:
  push:
    branches: [main]
    # A docs-only push gets no image, so its SHA is not a rollback target.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  packages: write

# One promote at a time, in order: two merges in quick succession must not race
# to open PRs that each move the tag.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/facorreiaa/postitheka:${{ github.sha }}
            ghcr.io/facorreiaa/postitheka:latest

  promote:
    name: Open promote PR against the infra repo
    needs: build-push
    runs-on: ubuntu-latest
    # Only the secret named below; this job needs nothing from this repository.
    permissions: {}
    steps:
      - name: Check delivery is configured
        id: gate
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_TOKEN }}
        run: |
          if [ -n "${INFRA_TOKEN}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout LuminaVaultInfra
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: LuminaVault/LuminaVaultInfra
          token: ${{ secrets.INFRA_TOKEN }}
          ref: main

      - name: Open pull request
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${TAG:0:7}"
          branch="promote/postitheka-${short}"
          values=apps/postitheka/api/values-production.yaml

          # sed rather than yq: yq -i drops the blank lines between commented
          # blocks, so every promote PR would carry whitespace churn.
          sed -i -E "s|^( *tag: ).*|\1\"${TAG}\"|" "$values"

          if git diff --quiet; then
            echo "already at ${short}; nothing to promote"
            exit 0
          fi

          git config user.name "postitheka-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "$values"
          git commit -m "chore(postitheka): promote image to ${short}"
          git push origin "${branch}"

          cat > /tmp/pr-body.md <<EOF
          Promotes Postitheka to \`${TAG}\`.

          Built from ${{ github.repository }}@${TAG} by the Image workflow.
          Merging this makes ArgoCD sync \`postitheka-production\` in the \`horus\`
          namespace; the PreSync hook dumps the database and runs migrations first.
          EOF

          gh pr create \
            --repo LuminaVault/LuminaVaultInfra \
            --base main \
            --head "${branch}" \
            --title "chore(postitheka): promote image to ${short}" \
            --body-file /tmp/pr-body.md

      - name: Report when delivery is not configured
        if: steps.gate.outputs.configured == 'false'
        run: |
          echo "::error title=Not deployed::INFRA_TOKEN is not set, so no promote PR was opened. The image is pushed; nothing deploys until the secret exists (contents:write and pull-requests:write on LuminaVault/LuminaVaultInfra), or a promote PR is opened by hand."
          exit 1
